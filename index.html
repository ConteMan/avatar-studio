<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>半身像工坊 · Avatar Studio</title>
<meta name="description" content="用种子拼出半身头像，调整五官、发型和配色，再导出 SVG 或 PNG。同一份配置得到同一张图。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --line:#e4e1da; --ink:#1b1a18; --muted:#757068;
    --label:#5c574f; --brand:#a9322b; --brand-soft:#f6e9e7; --radius:14px;
    --header-h:72px; --dock-h:600px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  ::selection{background:#f0d2ce;color:var(--ink)}
  button:focus-visible,input:focus-visible,summary:focus-visible{
    outline:2px solid var(--brand);outline-offset:2px;
  }
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);
    position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
  .brand .mark{width:32px;height:32px;flex:none;display:block}
  .brand h1{font-size:17px;margin:0;letter-spacing:.02em;font-weight:650;line-height:1.2;white-space:nowrap}
  .btn.about{border-color:transparent;background:transparent;color:var(--label)}
  .btn.about:hover{background:var(--brand-soft);color:var(--brand)}
  .seedbox{display:flex;align-items:center;gap:6px}
  .seedbox label{font-size:12px;color:var(--muted);white-space:nowrap}
  input[type=text]{
    width:132px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);font-size:13px;outline:none;
  }
  input[type=text]:focus{border-color:var(--brand)}
  .btn{
    padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;
    color:var(--ink);font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#c9c4bb;background:#faf9f6}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#932a24}
  main{
    display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;
    padding:24px 28px 48px;max-width:1500px;margin:0 auto;
  }
  .left{position:sticky;top:calc(var(--header-h) + 16px);align-self:start;min-width:0;width:100%;max-width:600px;margin:0 auto}
  .live-dock{width:100%;background:var(--bg)}
  .stage{width:100%;min-width:0}
  .canvas{
    background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    aspect-ratio:1/1;box-shadow:0 12px 40px rgba(30,25,20,.05);position:relative;
  }
  .canvas svg{width:100%;height:100%;display:block}
  .preview-actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .more-actions{position:relative}
  details.more-actions > summary{letter-spacing:normal;text-transform:none;font-size:13px;font-weight:500;line-height:1.2;display:grid;place-items:center}
  .more-options{
    position:absolute;z-index:1;top:calc(100% + 6px);left:0;display:grid;gap:4px;width:max-content;
    padding:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  }
  .more-options .btn{text-align:left}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;padding:8px 13px;font-size:12px;color:var(--muted)}
  .seg button:focus-visible{outline-offset:-3px}
  .seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .spacer{flex:1}
  .plain{margin:12px 0 4px;font-size:13px;color:var(--label);line-height:1.65;max-width:40rem}
  .stage > details{margin-top:8px}
  .stage > details summary{display:flex;align-items:center;gap:4px;width:fit-content;min-height:32px;letter-spacing:normal}
  .ggrid,.seedbox{margin-top:8px}
  .ggrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .ggrid button{
    aspect-ratio:1/1;padding:0;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:#fff;transition:.15s;
  }
  .ggrid button:hover{border-color:var(--brand);transform:translateY(-2px)}
  .ggrid svg{width:100%;height:100%;display:block}
  .panel{display:flex;flex-direction:column;gap:14px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card > h2{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:22px;font-weight:650;color:var(--ink);margin:0 0 14px;
  }
  .card > h2 .mini{float:none;margin:0}
  .slot{padding:12px 0;border-top:1px dashed var(--line)}
  .slot:first-of-type{border-top:0;padding-top:0}
  .slot-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .slot-head .name{font-size:13px;font-weight:600}
  .slot-head .count{font-size:11px;color:var(--muted);font-weight:400}
  .legacy-bg{margin:0 0 8px;color:var(--label);font-size:12px}
  .slot-head .spacer{flex:1}
  .mini{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);white-space:nowrap}
  .mini:hover{color:var(--ink)}
  .mini.on{background:var(--brand-soft);border-color:#e8c9c5;color:var(--brand)}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .opt{
    padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;align-items:stretch;transition:.15s;min-width:0;
  }
  .opt:hover{border-color:#c9c4bb}
  .opt.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .opt .thumb{aspect-ratio:1/1;background:#fbfaf7;display:block;overflow:hidden}
  .opt .thumb svg{width:100%;height:100%;display:block}
  .opt .oname{font-size:10px;color:var(--muted);padding:5px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.on .oname{color:var(--brand);font-weight:600}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .row:last-child{margin-bottom:0}
  .row label{font-size:12px;color:var(--label);width:76px;flex:none}
  .row input[type=range]{flex:1;accent-color:var(--brand);height:4px;min-width:0}
  .row .val{font-size:11px;color:var(--label);width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .palettes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pal{
    display:flex;align-items:center;gap:6px;padding:6px 9px 6px 6px;border:1px solid var(--line);
    border-radius:9px;background:#fff;font-size:11px;color:var(--muted)
  }
  .pal.on{border-color:var(--brand);color:var(--brand);font-weight:600}
  .dots{display:flex}
  .dots i{width:11px;height:11px;border-radius:50%;display:block;margin-right:-3px;border:1.5px solid #fff}
  .colorrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .citem{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
  .citem input[type=color]{
    width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer;flex:none
  }
  .citem input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .citem input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
  details{font-size:12px;color:var(--muted);line-height:1.8}
  details summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"＋ ";color:var(--brand)}
  details[open] summary::before{content:"－ "}
  details.more-actions > summary::before{content:none}
  details p{margin:12px 0 0}
  dialog{
    color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    width:min(36rem,calc(100% - 32px));max-height:calc(100% - 32px);padding:24px;overflow:auto;overscroll-behavior:contain;
  }
  dialog::backdrop{background:rgba(27,26,24,.5)}
  .about-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .about-head h2{font-size:20px;margin:0}
  dialog h3{font-size:15px;margin:22px 0 6px}
  dialog p{line-height:1.7;color:var(--label);margin:10px 0 0}
  .toast{
    position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:#1b1a18;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;transition:.22s
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1080px){
    main{grid-template-columns:1fr}
    .left{position:static;max-width:560px}
    .opts{grid-template-columns:repeat(6,1fr)}
  }
  @media(min-width:1081px){
    .left{max-width:min(600px,max(300px,calc(100dvh - var(--header-h) - 185px)))}
  }
  @media(max-width:620px){
    header{padding:14px 16px}
    main{padding:16px;gap:16px}
    .opts{grid-template-columns:repeat(4,1fr)}
    .ggrid{grid-template-columns:repeat(4,1fr)}
  }
  /* 窄屏：144px 预览贴在页头下。main 用块级而不是格子，预览才能在整页滚动时留住；控件排在预览下面。 */
  @media(max-width:720px){
    header{
      gap:8px 10px;
      padding-top:max(10px,env(safe-area-inset-top));
      padding-right:16px;padding-bottom:10px;padding-left:16px;
    }
    main{
      display:block;max-width:none;gap:0;
      padding:0 16px max(32px,env(safe-area-inset-bottom));
    }
    .left{display:contents;max-width:none;margin:0}
    .live-dock{
      position:sticky;top:var(--header-h);z-index:15;max-width:none;width:auto;
      display:flex;align-items:center;gap:12px;justify-content:center;
      margin:0 -16px;padding:10px 16px 12px;border-bottom:1px solid var(--line);
    }
    .canvas{width:144px;height:144px;flex:none;aspect-ratio:auto;box-shadow:0 8px 24px rgba(30,25,20,.06)}
    .preview-actions{display:grid;gap:6px;margin:0;width:min(11rem,calc(100% - 156px))}
    .preview-actions .btn{width:100%;padding-inline:6px}
    .more-options{right:0;left:auto}
    .more-options .btn{padding-inline:14px}
    .stage{margin-bottom:16px}
    .stage > details summary{min-height:40px}
    html{scroll-padding-top:calc(var(--header-h) + var(--dock-h) + 12px)}
    .btn,.seg button,.pal{min-height:44px}
    .mini{min-height:40px;padding:8px 10px}
    .row{min-height:44px}
    .row input[type=range]{height:28px}
    .brand{gap:6px}
    header .btn{padding-inline:8px}
    .seedbox input[type=text]{width:min(15rem,100%);min-width:0;min-height:44px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="mark" src="assets/mark.svg" width="32" height="32" alt="">
    <h1>半身像工坊</h1>
  </div>
  <button class="btn" id="btnRandom" type="button" title="随机更换未锁定的部件、参数和配色">随机生成</button>
  <button class="btn about" id="btnAbout" type="button" aria-haspopup="dialog">关于</button>
</header>

<main>
  <div class="left">
    <div class="live-dock">
      <div class="canvas" id="canvas" role="img" aria-label="当前半身像预览"></div>
      <div class="preview-actions" role="group" aria-label="下载与分享">
        <button class="btn primary" id="btnPng" type="button" title="下载 1024 × 1024 像素的图片">下载 PNG</button>
        <button class="btn" id="btnShare" type="button">复制分享链接</button>
        <details class="more-actions" id="moreActions">
          <summary class="btn">更多操作</summary>
          <div class="more-options">
            <button class="btn" id="btnSvg" type="button">下载 SVG</button>
            <button class="btn" id="btnJson" type="button">复制配置</button>
          </div>
        </details>
      </div>
    </div>
    <section class="stage">
      <div class="toolbar">
        <div class="seg" id="viewSeg" role="group" aria-label="裁切视图">
          <button type="button" data-view="half" class="on" aria-pressed="true">半身</button>
          <button type="button" data-view="bust" aria-pressed="false">胸像</button>
          <button type="button" data-view="head" aria-pressed="false">头像</button>
        </div>
      </div>
      <p class="plain">随机生成一个头像，再挑选部件、调整形状和配色。锁定喜欢的部件，下次随机时会保留它。</p>
      <details>
        <summary>从示例开始</summary>
        <div class="ggrid" id="gallery"></div>
      </details>
      <details>
        <summary>按种子生成</summary>
        <div class="seedbox"><label for="seed">种子</label><input id="seed" type="text" spellcheck="false" autocomplete="off" maxlength="160" aria-describedby="seedHelp"></div>
        <p id="seedHelp">输入后按回车或离开输入框。已锁定的设置会保留。</p>
      </details>
    </section>
  </div>

  <aside class="panel">
    <div class="card">
      <h2>部件</h2>
      <div id="slots"></div>
    </div>

    <div class="card">
      <h2><span>形状</span><button class="mini" id="lockParams" type="button" aria-pressed="false" title="锁定后，随机生成不会改变这些滑块">锁定</button></h2>
      <div id="params"></div>
    </div>

    <div class="card">
      <h2><span>配色</span><button class="mini" id="lockColors" type="button" aria-pressed="false" title="锁定后，随机生成不会改变配色">锁定</button></h2>
      <div class="palettes" id="palettes"></div>
      <div class="colorrow" id="colors"></div>
    </div>

  </aside>
</main>

<dialog id="aboutDialog" aria-labelledby="aboutTitle">
  <div class="about-head">
    <h2 id="aboutTitle">关于</h2>
    <form method="dialog"><button class="btn" type="submit" autofocus>关闭</button></form>
  </div>
  <p>在浏览器里搭配发型、五官、服装与配饰，再选择半身、胸像或头像裁切。图像在本机生成，打开即可使用。</p>
  <h3>草稿和分享</h3>
  <p>编辑后的草稿保存在当前浏览器。打开分享链接时会先显示链接里的头像，开始编辑后会保存为当前草稿。</p>
  <h3>头像如何生成</h3>
  <p>头像由 11 个绘制层叠成。发型和服装的前后层负责遮挡，形状与颜色可以独立调整。若想复现同一个头像，请保存完整配置或分享链接。</p>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
'use strict';

/* ============================================================
   ENGINE — 纯函数 SVG 渲染，无 DOM 依赖，可直接抽成 npm 包
   ============================================================ */
var Engine = (function () {

  var SLOTS = [
    { key:'bg',     name:'背景',       focus:'full', options:['plain','circle','dots','grid','rays','blob'] },
    { key:'body',   name:'衣服',       focus:'body', options:['hoodie','crew','tee','jacket','turtleneck','overalls'] },
    { key:'hair',   name:'发型',       focus:'head', options:['cloud','curly','bob','long','short','bun','pigtails','buzz','bald'] },
    { key:'eyes',   name:'眼睛 / 眼镜', focus:'face', options:['round','square','dots','closed','shades','monocle','wink'] },
    { key:'mouth',  name:'嘴巴',       focus:'face', options:['none','smile','flat','open','cat','smirk'] },
    { key:'extra',  name:'配饰',       focus:'head', options:['none','headphones','earrings','scarf','badge','freckles'] },
    { key:'topper', name:'头顶搭档',   focus:'head', options:['none','cat','calico','dog','bird','plant','cap','bow'] }
  ];

  var LABELS = {
    plain:'纯色', circle:'圆形', dots:'圆点', grid:'网格', rays:'放射', blob:'色块',
    hoodie:'连帽衫', crew:'圆领', tee:'T 恤', jacket:'翻领', turtleneck:'高领', overalls:'背带',
    cloud:'蓬松卷', curly:'小卷', bob:'波波头', long:'长发', short:'短发', bun:'丸子头', pigtails:'双马尾', buzz:'寸头', bald:'光头',
    round:'圆框', square:'方框', dots:'点眼', closed:'弯眼', shades:'墨镜', monocle:'单片镜', wink:'眨眼',
    none:'无', smile:'微笑', flat:'抿嘴', open:'张嘴', cat:'猫嘴', smirk:'坏笑',
    headphones:'耳机', earrings:'耳环', scarf:'围巾', badge:'徽章', freckles:'雀斑',
    cat:'黑猫', calico:'花猫', dog:'小狗', bird:'小鸟', plant:'绿植', cap:'鸭舌帽', bow:'蝴蝶结'
  };

  var PALETTES = [
    { name:'砖红', colors:{ ink:'#141414', skin:'#ffffff', hair:'#a9322b', cloth:'#a9322b', accent:'#141414', bg:'#ffffff' } },
    { name:'靛蓝', colors:{ ink:'#1d2836', skin:'#fff5e9', hair:'#2f4d7c', cloth:'#dfa63b', accent:'#1d2836', bg:'#f4efe3' } },
    { name:'抹茶', colors:{ ink:'#23302a', skin:'#fffaf0', hair:'#3f6b50', cloth:'#e2c46e', accent:'#23302a', bg:'#f6f5ec' } },
    { name:'莓果', colors:{ ink:'#2d1b2e', skin:'#fff3f5', hair:'#7c3f6d', cloth:'#e8a0a8', accent:'#2d1b2e', bg:'#fbf4f6' } },
    { name:'海盐', colors:{ ink:'#17324d', skin:'#fff8ec', hair:'#d9a05b', cloth:'#4f86a8', accent:'#17324d', bg:'#eaf3f7' } },
    { name:'炭灰', colors:{ ink:'#1a1a1a', skin:'#f7f4ee', hair:'#2b2b2b', cloth:'#d8d4cb', accent:'#b5533f', bg:'#f2f1ed' } }
  ];

  var VIEWS = { half:'0 0 600 600', bust:'60 60 480 480', head:'140 60 320 340' };
  var FOCUS = { full:'0 0 600 600', head:'160 90 280 340', face:'215 215 170 170', body:'120 385 360 215' };

  var SW = 8;            // 主体描边
  var SW_THIN = 5;
  var SW_BOLD = 16;      // 尾巴等粗笔画

  function hash32(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rngFor(seed, tag) { return mulberry32(hash32(String(seed) + '|' + tag)); }
  function n(x) { return Math.round(x * 10) / 10; }
  function slotDef(key) { for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].key === key) return SLOTS[i]; return null; }
  function fromSeed(seed, key) {
    var d = slotDef(key);
    return d.options[hash32(String(seed) + '|' + key) % d.options.length];
  }
  function paletteIndex(seed) { return hash32(String(seed) + '|palette') % PALETTES.length; }

  function defaultState() {
    var c = {}; for (var k in PALETTES[0].colors) c[k] = PALETTES[0].colors[k];
    return {
      seed: 'studio-01',
      slots: { bg:'plain', body:'hoodie', hair:'cloud', eyes:'round', mouth:'smile', extra:'none', topper:'cat' },
      locks: {},
      params: { volume:1.00, wave:0.50, length:0.35, fringe:0.35, faceW:1.00, shoulders:1.00 },
      colors: c,
      palette: 0,
      view: 'half'
    };
  }

  /* --- 基础绘图原语 --- */
  function path(d, fill, stroke, sw, extra) {
    return '<path d="' + d + '" fill="' + (fill || 'none') + '" stroke="' + (stroke || 'none') +
      '" stroke-width="' + (sw || 0) + '" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '/>';
  }
  function circle(cx, cy, r, fill, stroke, sw) {
    return '<circle cx="' + n(cx) + '" cy="' + n(cy) + '" r="' + n(r) + '" fill="' + (fill || 'none') +
      '" stroke="' + (stroke || 'none') + '" stroke-width="' + (sw || 0) + '"/>';
  }
  function rr(x, y, w, h, r, fill, stroke, sw) {
    return '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) +
      '" rx="' + n(r) + '" fill="' + (fill || 'none') + '" stroke="' + (stroke || 'none') +
      '" stroke-width="' + (sw || 0) + '"/>';
  }
  /* ---------- 曲线工具 ----------
     Catmull-Rom 转三次贝塞尔：相邻段共享切线，保证 C1 连续。
     之前逐段拼 Q 曲线，接点处切线跳变，就是画面里"线条抖动/折角"的根因。 */
  function crPath(pts, closed, tailOnly) {
    var p = pts;
    if (!closed) {
      var f = [2 * p[0][0] - p[1][0], 2 * p[0][1] - p[1][1]];
      var l = [2 * p[p.length - 1][0] - p[p.length - 2][0], 2 * p[p.length - 1][1] - p[p.length - 2][1]];
      p = [f].concat(p, [l]);
    }
    var N = p.length, segs = closed ? N : N - 3;
    var d = tailOnly ? '' : 'M ' + n(pts[0][0]) + ' ' + n(pts[0][1]);
    for (var i = 0; i < segs; i++) {
      var p0 = p[closed ? (i - 1 + N) % N : i];
      var p1 = p[closed ? i % N : i + 1];
      var p2 = p[closed ? (i + 1) % N : i + 2];
      var p3 = p[closed ? (i + 2) % N : i + 3];
      d += ' C ' + n(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + n(p1[1] + (p2[1] - p0[1]) / 6) +
        ' ' + n(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + n(p2[1] - (p3[1] - p1[1]) / 6) +
        ' ' + n(p2[0]) + ' ' + n(p2[1]);
    }
    if (closed) d += ' Z';
    return d;
  }

  /* 低频起伏：正弦叠加，而不是逐点白噪声。
     白噪声让相邻采样点幅值独立跳变 → 轮廓锯齿；正弦叠加保证起伏是连续的。 */
  function wave(t, waves, ph1, ph2) {
    return Math.sin(t * waves + ph1) * 0.7 + Math.sin(t * waves * 2.4 + ph2) * 0.3;
  }

  /* 椭圆采样点：给叶片、鸟身、围巾这类有机形状用，
     配合 crPath 得到没有尖角的闭合轮廓（手写 Z 收口必然留下折角）。 */
  function ellipsePts(cx, cy, rx, ry, rotDeg, count) {
    var pts = [], rot = (rotDeg || 0) * Math.PI / 180, n2 = count || 10;
    for (var i = 0; i < n2; i++) {
      var t = i / n2 * Math.PI * 2;
      var x = Math.cos(t) * rx, y = Math.sin(t) * ry;
      pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
    }
    return pts;
  }

  /* 沿椭圆上半圈取点：从左端点(π)到右端点(0)，半径带低频起伏 */
  function arcPoints(cx, cy, rx, ry, count, waves, amp, ph1, ph2) {
    var pts = [];
    for (var i = 0; i <= count; i++) {
      var t = Math.PI - Math.PI * i / count;
      var rad = 1 + wave(t, waves, ph1, ph2) * amp;
      pts.push([cx + rx * Math.cos(t) * rad, cy - ry * Math.sin(t) * rad]);
    }
    return pts;
  }

  /* --- 各绘制层 --- */
  function bgLayer(st, C) {
    var v = st.slots.bg, out = '', i;
    if (v === 'circle') {
      out += circle(300, 300, 218, C.cloth, null, 0).replace('/>', ' opacity="0.16"/>');
    } else if (v === 'dots') {
      for (i = 0; i < 7; i++) for (var j = 0; j < 7; j++) {
        out += circle(40 + i * 87, 40 + j * 87, 7, C.ink, null, 0).replace('/>', ' opacity="0.10"/>');
      }
    } else if (v === 'grid') {
      for (i = 0; i <= 6; i++) {
        var p = 50 + i * 84;
        out += path('M ' + p + ' 0 L ' + p + ' 600 M 0 ' + p + ' L 600 ' + p, null, C.ink, 2).replace('/>', ' opacity="0.09"/>');
      }
    } else if (v === 'rays') {
      for (i = 0; i < 12; i++) {
        var t = i * Math.PI / 6;
        out += path('M 300 300 L ' + n(300 + Math.cos(t) * 620) + ' ' + n(300 + Math.sin(t) * 620), null, C.cloth, 26).replace('/>', ' opacity="0.09"/>');
      }
    } else if (v === 'blob') {
      // 色块：椭圆采样 + 低频半径起伏，再样条收口。
      // 手写 C 链的凹凸控制点方向不连续，会在转折处留下可测的折角。
      var bp = ellipsePts(286, 318, 214, 142, -9, 10);
      for (var bi = 0; bi < bp.length; bi++) {
        var kk = 1 + Math.sin(bi * 1.7 + 0.4) * 0.09;
        bp[bi] = [286 + (bp[bi][0] - 286) * kk, 318 + (bp[bi][1] - 318) * kk];
      }
      out += path(crPath(bp, true), C.cloth, null, 0).replace('/>', ' opacity="0.17"/>');
    }
    return out;
  }

  /* ---------- 拼接锚点 ----------
     跨部件的接口坐标只在这里定义一次。脖子两侧的线与衣服领口的 U 形
     共用同一组数字，所以端点必然重合，不会再出现"悬空/断裂"。 */
  var GEO = {
    cx: 300,
    faceTop: 242, faceBot: 374, faceHalfW: 68,
    neckHalf: 30,          // 脖宽 → 270..330
    neckTop: 352,
    neckBottom: 520,       // 脖块下沿，远低于领口，保证被衣服完全盖住
    collarY: 402,          // 领口基面 = 衣服上缘
    collarDepth: 72,       // 领口开口深度（太浅会让脖区被框成一个小方块）
    shoulderOff: 108,      // 肩头相对中心的 x 偏移
    hemHalf: 208,          // 下摆半宽
    hemY: 648
  };
  var NECK_L = GEO.cx - GEO.neckHalf;   // 274
  var NECK_R = GEO.cx + GEO.neckHalf;   // 326

  function bodyBack(st, C) {
    // 极简抽象：只有 6 个关键点 —— 领口左 / 左肩 / 左侧 / 下摆 / 右肩 / 领口右 + 领口底。
    // 漫画风格不需要写实轮廓，拐点越少越容易保证流畅。
    var k = st.params.shoulders, cx = GEO.cx;
    var sh = 110 * k, hem = 164 * k, y = GEO.collarY;
    var pts = [
      [n(cx - GEO.neckHalf), y],
      [n(cx - sh), n(y + 10)],
      [n(cx - hem * 0.92), 528],
      [n(cx - hem), 662],
      [n(cx + hem), 662],
      [n(cx + hem * 0.92), 528],
      [n(cx + sh), n(y + 10)],
      [n(cx + GEO.neckHalf), y],
      [cx, n(y + 26)]
    ];
    return path(crPath(pts, true), C.cloth, C.ink, SW);
  }

  function neck(st, C) {
    // 白块一直延伸到衣服内部（多出的部分被衣服填充盖住），
    // 露出的部分正好填满领口的 U；两侧线端点与 U 的端点完全重合。
    return path('M ' + NECK_L + ' ' + GEO.neckTop + ' L ' + NECK_L + ' ' + GEO.neckBottom +
      ' L ' + NECK_R + ' ' + GEO.neckBottom + ' L ' + NECK_R + ' ' + GEO.neckTop + ' Z', C.skin, null, 0) +
      path('M ' + NECK_L + ' 364 L ' + NECK_L + ' ' + GEO.collarY +
        ' M ' + NECK_R + ' 364 L ' + NECK_R + ' ' + GEO.collarY, null, C.ink, SW);
  }

  function face(st, C) {
    var w = GEO.faceHalfW * st.params.faceW, cx = GEO.cx, top = GEO.faceTop, bot = GEO.faceBot;
    /* 下颌：从太阳穴起就开始持续内收。原来是 0.97→0.88 到 y=348 才急速
       收到 0.68，等于"直筒 + 切角"，脸看起来是个电视屏幕。改成 7 点均匀
       收敛，脸型变成蛋形。 */
    var jaw = [
      [cx - w, top + 24],
      [cx - w * 0.99, top + 50],
      [cx - w * 0.94, top + 78],
      [cx - w * 0.83, top + 104],
      [cx - w * 0.64, top + 120],
      [cx - w * 0.34, bot - 3],
      [cx, bot],
      [cx + w * 0.34, bot - 3],
      [cx + w * 0.64, top + 120],
      [cx + w * 0.83, top + 104],
      [cx + w * 0.94, top + 78],
      [cx + w * 0.99, top + 50],
      [cx + w, top + 24]
    ];
    // 整个头形（下颌 + 头顶）用同一个闭合点集生成，保证边界完全连续，
    // 同时也让白色填充与描边严格重合。
    var headPts = jaw.slice();
    var crown = arcPoints(cx, top - 16, w * 0.99, 54, 14, 2, 0, 0, 0);
    for (var ci = crown.length - 1; ci >= 0; ci--) headPts.push(crown[ci]);
    var out = path(crPath(headPts, true), C.skin, null, 0) + path(crPath(jaw, false), null, C.ink, SW);
    if (st.slots.hair === 'bald') {
      var sk = arcPoints(cx, 268, w, 92, 14, 2, 0, 0, 0);
      out += path(crPath(sk, false), null, C.ink, SW);
    }
    return out;
  }

  /* 发型尺寸的硬约束：
     - 头骨椭圆 = arcPoints(cx, faceTop-16, faceHalfW*0.99, 54)，顶点在 y=172。
       所以 ry 必须满足 252-ry <= 166，即 ry >= 86，否则白底之外会露出头皮。
     - 脸半宽 68，rx 控制在 84~94：比脸宽 16~26px 正好。原来 118 宽出 50px，
       两侧就成了"翅膀"，整体像爆炸头/假发。 */
  var HAIR_CFG = {
    cloud:    { rx:90, ry:86, lobes:5, bulge:10, side:30,  fr:0.30 },
    curly:    { rx:94, ry:86, lobes:8, bulge:9,  side:28,  fr:0.34 },
    bob:      { rx:90, ry:88, lobes:4, bulge:8,  side:74,  fr:0.26 },
    long:     { rx:92, ry:90, lobes:4, bulge:9,  side:118, fr:0.28 },
    short:    { rx:86, ry:84, lobes:4, bulge:7,  side:20,  fr:0.22 },
    bun:      { rx:88, ry:84, lobes:4, bulge:8,  side:22,  fr:0.24, bun:true },
    pigtails: { rx:86, ry:84, lobes:4, bulge:8,  side:24,  fr:0.24, tails:true },
    buzz:     { rx:84, ry:82, lobes:6, bulge:5,  side:12,  fr:0.18 }
  };

  function hairGeom(st) {
    var cfg = HAIR_CFG[st.slots.hair] || HAIR_CFG.cloud;
    var v = st.params.volume, wv = st.params.wave, ln = st.params.length;
    return {
      cfg: cfg,
      cx: 300, cy: 252,
      rx: cfg.rx * v,
      ry: cfg.ry * v,
      lobes: Math.max(3, Math.round(cfg.lobes + (wv - 0.5) * 8)),
      bulge: cfg.bulge * (0.65 + wv * 0.7),
      side: cfg.side * (0.45 + ln * 1.25),
      fr: cfg.fr,
      slant: st.params.fringe
    };
  }

  /* hairBack 画在 face 之前，所以只有"超出脸轮廓"的部分才看得见。
     这决定了这里的坐标必须贴着脸的边缘算 —— 原来 bob 外沿到 cx+122、
     pigtails 到 cx+138，露出来就是两块耳罩和两个浮空的圆球。 */
  function hairBack(st, C) {
    var g = hairGeom(st), s = st.slots.hair, out = '', cx = g.cx;
    var R = g.rx;
    if (s === 'pigtails') {
      // 两束马尾：起点落在脸轮廓以内，确保和头连上，再向外下垂
      [-1, 1].forEach(function (sg) {
        var bx = cx + sg * R * 0.82;
        var pts = [
          [bx, 254], [bx + sg * R * 0.24, 276], [bx + sg * R * 0.33, 312],
          [bx + sg * R * 0.22, 348], [bx + sg * R * 0.02, 360],
          [bx - sg * R * 0.15, 330], [bx - sg * R * 0.18, 286],
          [bx - sg * R * 0.09, 258]
        ];
        out += path(crPath(pts, true), C.hair, C.ink, SW);
      });
    } else if (s === 'long' || s === 'bob') {
      var bot = 250 + g.side * 1.35;
      [-1, 1].forEach(function (sg) {
        var bx = cx + sg * R * 0.76;
        var pts = [
          [bx, 232],
          [bx + sg * R * 0.25, 272],
          [bx + sg * R * 0.28, 316],
          [bx + sg * R * 0.26, bot - 12],
          [bx + sg * R * 0.14, bot + 6],
          [bx - sg * R * 0.02, bot],
          [bx - sg * R * 0.16, 320],
          [bx - sg * R * 0.13, 258]
        ];
        out += path(crPath(pts, true), C.hair, C.ink, SW);
      });
    }
    return out;
  }

  function hairMain(st, C) {
    if (st.slots.hair === 'bald') return '';
    var g = hairGeom(st), r = rngFor(st.seed, 'hair-shape');
    var cx = g.cx, cy = g.cy, rx = g.rx, ry = g.ry;
    var asym = (r() - 0.5) * 0.5;
    var sideR = g.side * (1 - asym), sideL = g.side * (1 + asym);
    var ph1 = r() * 6.283, ph2 = r() * 6.283;
    // 刘海底线：原来 238+fr*30+slant*22 会压到眼睛；眼睛下移到 284 后
    // 圆镜片顶端在 257，这里收到 232+fr*16+slant*14（最高约 247），留出额头。
    var yR = 232 + g.fr * 16 + g.slant * 14;
    var yL = 232 + g.fr * 16 - g.slant * 14;

    // 整圈一次走完，横向位移全程单调，收口才不会留折角：
    // 左鬓角尖 → 左外沿(上行) → 头顶弧 → 右外沿(下行) → 右鬓角尖
    // → 右内沿(上行) → 刘海(右→左) → 左内沿(下行) → 闭合回左尖
    var pts = [
      [cx - rx * 0.93, cy + sideL + 4],
      [cx - rx * 1.002, cy + sideL * 0.5]
    ];
    pts = pts.concat(arcPoints(cx, cy, rx, ry, Math.max(12, g.lobes * 3), g.lobes,
      Math.min(0.075, g.bulge / rx * 0.55), ph1, ph2));

    pts.push([cx + rx * 1.002, cy + sideR * 0.5]);
    pts.push([cx + rx * 0.93, cy + sideR + 4]);
    // 内沿从鬓角尖往发际线上行，y 必须单调递减；
    // 原来写死的 cy+30 在 side 小的发型上会比上一句更低，形成一处反向的缺口。
    pts.push([cx + rx * 0.82, cy + sideR * 0.55]);
    pts.push([cx + rx * 0.70, yR + 9]);
    pts.push([cx + 54, yR]);

    var nF = 5, phF = r() * 6.283, ampF = 4 + g.fr * 6;
    for (var j = 1; j <= nF; j++) {
      var u = j / nF;
      pts.push([
        cx + 54 - 108 * u,
        yR + (yL - yR) * u + Math.sin(u * Math.PI * 3 + phF) * ampF * Math.sin(Math.PI * u)
      ]);
    }

    pts.push([cx - rx * 0.70, yL + 9]);
    pts.push([cx - rx * 0.82, cy + sideL * 0.55]);

    var out = path(crPath(pts, true), C.hair, C.ink, SW);
    if (g.cfg.bun) {
      var bunPts = [];
      for (var bi = 0; bi < 14; bi++) {
        var bt = bi / 14 * Math.PI * 2;
        bunPts.push([cx + Math.cos(bt) * 36, 186 + Math.sin(bt) * 30]);
      }
      out += path(crPath(bunPts, true), C.hair, C.ink, SW);
    }
    return out;
  }

  /* 眼睛：整体下移到 y=284（原来 278 离发际线太近，刘海必然压到眼睛；
     而且眼→嘴 66、嘴→下巴 30，比例失衡）。镜片半宽收到 25，
     左右镜片在中央留 6px 缝 —— 原来 60 宽 ×2 正好在 x=300 首尾相接，
     两个镜片会连成一条黑杠。 */
  function eyes(st, C) {
    var v = st.slots.eyes, out = '', ink = C.ink, skin = C.skin;
    var l = 272, r2 = 328, y = 284, R = 27, HW = 25;
    var brow = ' M ' + (l - 22) + ' ' + (y - 8) + ' L ' + (l - 33) + ' ' + (y - 13) +
      ' M ' + (r2 + 22) + ' ' + (y - 8) + ' L ' + (r2 + 33) + ' ' + (y - 13);
    var bridge = ' M ' + (l + HW) + ' ' + (y - 8) + ' L ' + (r2 - HW) + ' ' + (y - 8);
    if (v === 'round') {
      out += circle(l, y, R, skin, ink, SW) + circle(r2, y, R, skin, ink, SW);
      out += path(bridge + brow, null, ink, SW);
    } else if (v === 'square') {
      out += rr(l - HW, y - 22, HW * 2, 44, 10, skin, ink, SW) + rr(r2 - HW, y - 22, HW * 2, 44, 10, skin, ink, SW);
      out += path(bridge + brow, null, ink, SW);
    } else if (v === 'dots') {
      out += circle(l, y, 7, ink, null, 0) + circle(r2, y, 7, ink, null, 0);
    } else if (v === 'closed') {
      out += path('M ' + (l - 24) + ' ' + y + ' Q ' + l + ' ' + (y - 19) + ' ' + (l + 24) + ' ' + y +
        ' M ' + (r2 - 24) + ' ' + y + ' Q ' + r2 + ' ' + (y - 19) + ' ' + (r2 + 24) + ' ' + y, null, ink, SW);
    } else if (v === 'shades') {
      out += rr(l - HW - 1, y - 19, (HW + 1) * 2, 38, 8, ink, ink, SW) +
        rr(r2 - HW - 1, y - 19, (HW + 1) * 2, 38, 8, ink, ink, SW);
      out += path(' M ' + (l + HW + 1) + ' ' + (y - 6) + ' L ' + (r2 - HW - 1) + ' ' + (y - 6) + brow, null, ink, SW);
      out += path('M ' + (l - 14) + ' ' + (y - 9) + ' L ' + (l + 2) + ' ' + (y - 15) +
        ' M ' + (r2 + 14) + ' ' + (y - 9) + ' L ' + (r2 - 2) + ' ' + (y - 15), null, skin, 3).replace('/>', ' opacity="0.55"/>');
    } else if (v === 'monocle') {
      out += circle(l, y, 28, skin, ink, SW) +
        path('M ' + (l + 26) + ' ' + (y + 23) + ' C ' + (l + 18) + ' ' + (y + 53) + ' ' +
          (l + 6) + ' ' + (y + 63) + ' ' + (l + 6) + ' ' + (y + 60), null, ink, SW_THIN);
      out += circle(r2, y, 6, ink, null, 0);
    } else if (v === 'wink') {
      out += path('M ' + (l - 24) + ' ' + y + ' Q ' + l + ' ' + (y - 19) + ' ' + (l + 24) + ' ' + y,
        null, ink, SW) + circle(r2, y, 7, ink, null, 0);
    }
    return out;
  }

  function mouth(st, C) {
    var v = st.slots.mouth, ink = C.ink, d = '';
    if (v === 'smile') d = 'M 282 340 Q 300 358 318 340';
    else if (v === 'flat') d = 'M 286 344 L 314 344';
    // 猫嘴 ω 形：形状保留，但用样条过点，中峰不再是 103° 的硬折角
    else if (v === 'cat') d = crPath([[282, 339], [290, 350], [300, 341], [310, 350], [318, 339]], false);
    else if (v === 'smirk') d = 'M 284 346 Q 302 354 318 336';
    else if (v === 'open') return path(crPath(ellipsePts(300, 346, 12, 11, 0, 10), true), ink, null, 0);
    return d ? path(d, null, ink, SW) : '';
  }

  function bodyFront(st, C) {
    // 极简：每个款式只留 1–3 条识别线，不画褶皱、不重复肩线。
    // 线条越少，越容易保持流畅；细节留给配色和配件。
    var v = st.slots.body, ink = C.ink, cloth = C.cloth, out = '', cx = GEO.cx;
    var y = GEO.collarY;
    if (v === 'hoodie') {
      out += path('M ' + n(cx - 11) + ' ' + n(y + 26) + ' L ' + n(cx - 14) + ' ' + n(y + 92) +
        ' M ' + n(cx + 11) + ' ' + n(y + 26) + ' L ' + n(cx + 14) + ' ' + n(y + 92), null, ink, SW_THIN);
      out += circle(cx - 14, y + 97, 4.5, null, ink, SW_THIN) + circle(cx + 14, y + 97, 4.5, null, ink, SW_THIN);
    } else if (v === 'crew') {
      out += path('M ' + n(cx - 26) + ' ' + n(y + 2) + ' Q ' + cx + ' ' + n(y + 34) + ' ' + n(cx + 26) + ' ' + n(y + 2), null, ink, SW_THIN);
    } else if (v === 'tee') {
      out += path('M ' + n(cx - 96) + ' ' + n(y + 40) + ' L ' + n(cx - 116) + ' ' + n(y + 96) +
        ' M ' + n(cx + 96) + ' ' + n(y + 40) + ' L ' + n(cx + 116) + ' ' + n(y + 96), null, ink, SW);
    } else if (v === 'jacket') {
      out += path('M ' + n(cx - 34) + ' ' + n(y + 18) + ' L ' + cx + ' ' + n(y + 58) + ' L ' + n(cx + 34) + ' ' + n(y + 18), null, ink, SW);
      out += path('M ' + cx + ' ' + n(y + 58) + ' L ' + cx + ' 662', null, ink, SW);

    if (!url) { toast('分享链接生成失败'); return; }
    try {
      if (history && typeof history.replaceState === 'function') history.replaceState(history.state, '', url);
    } catch (e) {}
    copyText(url, '分享链接已复制');
  });
  $('#btnSvg').addEventListener('click', function () {
    closeMoreActions();
    var name = fileStem() + '.svg';
    var svg = stateModel.render(state);
    download(name, svg, 'image/svg+xml;charset=utf-8');
    toast('已导出 SVG');
  });
  $('#btnPng').addEventListener('click', exportPng);
  $('#btnJson').addEventListener('click', function () {
    closeMoreActions();
    copyText(Export.jsonText(state), '配置 JSON 已复制');
  });
  $('#viewSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]'); if (!b) return;
    state.view = b.dataset.view;
    noteEdit();
    refresh();
  });
  $('#lockParams').addEventListener('click', function () { state.locks.params = !state.locks.params; noteEdit(); refresh(); });
  $('#lockColors').addEventListener('click', function () { state.locks.colors = !state.locks.colors; noteEdit(); refresh(); });

  /* ---------- 启动 ---------- */
  document.documentElement.setAttribute('data-avatar-source', boot.source);
  buildSlots();
  buildParams();
  buildColors();
  buildGallery();
  refresh();
  if (boot.notice) toast(boot.notice);

})();
</script>
</body>
</html>
